name: Build TrustTunnel Android .so

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options: [Release, Debug]
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-trusttunnel-android.yml'
      - 'trusttunnel_proxy_jni.cpp'

env:
  NDK_VERSION:    "28.1.13356709"
  CMAKE_VERSION:  "3.31.6"
  PYTHON_VERSION: "3.13"

jobs:
  build:
    name: Build .so (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]

    steps:
      # ── 1. Чекаут — это и есть форк coidarashka/TrustTunnelClient ──────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Патчим CMakeLists — добавляем нашу target ───────────────────
      - name: Inject proxy wrapper into CMakeLists
        run: |
          # trusttunnel_proxy_jni.cpp лежит в корне репо
          cp trusttunnel_proxy_jni.cpp platform/android/

          if ! grep -q "trusttunnel_proxy" platform/android/CMakeLists.txt; then
            cat >> platform/android/CMakeLists.txt << 'CMAKE'

          # ── TrustTunnel Proxy wrapper (ReMandre / Telegram plugin) ──────
          add_library(trusttunnel_proxy SHARED
              ${CMAKE_CURRENT_SOURCE_DIR}/trusttunnel_proxy_jni.cpp
          )
          target_include_directories(trusttunnel_proxy PRIVATE
              ${CMAKE_SOURCE_DIR}
              ${CMAKE_SOURCE_DIR}/core/include
              ${CMAKE_SOURCE_DIR}/common
              ${CMAKE_SOURCE_DIR}/net
              ${CMAKE_SOURCE_DIR}/vpn
          )
          target_link_libraries(trusttunnel_proxy vpnlibs_core android log)
          CMAKE
            echo "CMakeLists.txt patched"
          else
            echo "CMakeLists.txt already patched"
          fi

      # ── 3. Системные зависимости ────────────────────────────────────────
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang libc++-dev libc++abi-dev llvm \
            pkg-config curl unzip git perl nasm

      # ── 4. Python ───────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python deps
        run: |
          python3 -m venv ../env
          source ../env/bin/activate
          pip install --upgrade pip
          pip install "conan>=2.0.5" cmake
          pip install -r scripts/requirements.txt || true
          echo "PATH=$(python3 -c 'import sys; print(sys.prefix)')/bin:$PATH" >> $GITHUB_ENV
          echo "VIRTUAL_ENV=$(pwd)/../env" >> $GITHUB_ENV

      # ── 5. Rust + cargo-ndk (нужен для quiche/0.17.1) ──────────────────
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo-ndk binary
        uses: actions/cache@v4
        id: cargo-ndk-cache
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-v3-linux

      - name: Install cargo-ndk
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      # ── 6. Go ───────────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.18.3'

      # ── 7. JDK + Android SDK/NDK ────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install \
            "ndk;${{ env.NDK_VERSION }}" \
            "cmake;${{ env.CMAKE_VERSION }}" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      # ── 8. Кэш Conan ────────────────────────────────────────────────────
      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ matrix.abi }}-${{ hashFiles('conanfile.py','conandata.yml') }}
          restore-keys: conan2-${{ matrix.abi }}-

      # ── 9. Conan profile для Android ────────────────────────────────────
      - name: Configure Conan profile
        run: |
          source ../env/bin/activate
          conan profile detect --force

          ABI="${{ matrix.abi }}"
          case "$ABI" in
            arm64-v8a)   CONAN_ARCH="armv8"  ; RUST_TARGET="aarch64-linux-android"   ;;
            armeabi-v7a) CONAN_ARCH="armv7"  ; RUST_TARGET="armv7-linux-androideabi"  ;;
            x86_64)      CONAN_ARCH="x86_64" ; RUST_TARGET="x86_64-linux-android"    ;;
          esac

          # Сохраняем RUST_TARGET для cargo-ndk
          echo "RUST_TARGET=${RUST_TARGET}" >> $GITHUB_ENV

          mkdir -p ~/.conan2/profiles
          cat > ~/.conan2/profiles/android_${ABI} << PROF
[settings]
os=Android
os.api_level=26
arch=${CONAN_ARCH}
compiler=clang
compiler.version=19
compiler.libcxx=c++_shared
compiler.cppstd=20
build_type=${{ github.event.inputs.build_type || 'Release' }}

[conf]
tools.android:ndk_path=${ANDROID_NDK_HOME}
tools.build:compiler_executables={"c": "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang", "cpp": "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"}
PROF

          # Также создаём android.toolchain.cmake который ожидает conan/profiles/
          mkdir -p conan/profiles
          # Указываем путь в conan profile (некоторые пакеты читают user_toolchain)
          cat > conan/profiles/android.toolchain.cmake << 'TOOLCHAIN'
set(CMAKE_ANDROID_NDK "$ENV{ANDROID_NDK_HOME}")
set(ANDROID_NDK "$ENV{ANDROID_NDK_HOME}")
TOOLCHAIN

      # ── 10. Bootstrap Conan зависимостей ────────────────────────────────
      - name: Bootstrap Conan deps
        run: |
          source ../env/bin/activate
          python3 scripts/bootstrap_conan_deps.py \
            --profile android_${{ matrix.abi }}

      # ── 11. CMake configure ─────────────────────────────────────────────
      - name: CMake configure
        run: |
          source ../env/bin/activate
          BUILD_TYPE="${{ github.event.inputs.build_type || 'Release' }}"
          NDK="$ANDROID_NDK_HOME"

          cmake \
            -B build_${{ matrix.abi }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_TOOLCHAIN_FILE="${NDK}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_ANDROID_NDK="${NDK}" \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=26 \
            .

      # ── 12. Сборка ──────────────────────────────────────────────────────
      - name: Build vpnlibs_core + trusttunnel_proxy
        run: |
          source ../env/bin/activate
          cmake --build build_${{ matrix.abi }} \
            --target vpnlibs_core trusttunnel_proxy \
            --parallel $(nproc)

      # ── 13. Собираем артефакты ──────────────────────────────────────────
      - name: Collect .so files
        run: |
          ABI="${{ matrix.abi }}"
          mkdir -p artifacts/${ABI}

          find build_${ABI} -name "libtrustunnel_proxy.so" \
            ! -path "*/CMakeFiles/*" \
            -exec cp -v {} artifacts/${ABI}/ \;

          find build_${ABI} -name "libvpnlibs_core.so" \
            ! -path "*/CMakeFiles/*" \
            -exec cp -v {} artifacts/${ABI}/ \; 2>/dev/null || true

          find "$ANDROID_NDK_HOME" \
            -path "*/${ABI}/libc++_shared.so" \
            -exec cp -v {} artifacts/${ABI}/ \; 2>/dev/null || true

          echo "=== ${ABI} ==="
          ls -lh artifacts/${ABI}/

      - name: Upload artifact (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: tt-proxy-${{ matrix.abi }}-${{ github.event.inputs.build_type || 'Release' }}
          path: artifacts/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 30

  # ── Пакуем все ABI в один ZIP ────────────────────────────────────────────
  package:
    name: Package all ABIs
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tt-proxy-*
          path: raw
          merge-multiple: false

      - name: Build jniLibs structure
        run: |
          mkdir -p jniLibs
          for dir in raw/tt-proxy-*/; do
            ABI=$(basename "$dir" | sed 's/^tt-proxy-//' | sed 's/-Release$//' | sed 's/-Debug$//')
            mkdir -p jniLibs/${ABI}
            find "$dir" -name "*.so" -exec cp -v {} jniLibs/${ABI}/ \;
          done
          echo "── jniLibs ──"
          find jniLibs -name "*.so" | sort

      - name: Create ZIP
        run: |
          zip -r trusttunnel-android-jniLibs.zip jniLibs/
          ls -lh trusttunnel-android-jniLibs.zip

      - name: Upload combined
        uses: actions/upload-artifact@v4
        with:
          name: trusttunnel-android-all-abis
          path: trusttunnel-android-jniLibs.zip
          retention-days: 30

      - name: Job summary
        run: |
          echo "## ✅ Build done" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| ABI | Files |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for abi in arm64-v8a armeabi-v7a x86_64; do
            n=$(find jniLibs/${abi} -name "*.so" 2>/dev/null | wc -l)
            echo "| \`${abi}\` | ${n} .so |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Артефакт: \`trusttunnel-android-all-abis\` → \`trusttunnel-android-jniLibs.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "Положи \`libtrustunnel_proxy.so\` в ReMandre под именем \`libtrustunnel_proxy\`" >> $GITHUB_STEP_SUMMARY
