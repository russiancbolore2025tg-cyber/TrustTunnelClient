name: Build TrustTunnel Android .so

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options: [Release, Debug]
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-trusttunnel-android.yml'
      - 'trusttunnel_proxy_jni.cpp'

env:
  NDK_VERSION: "28.1.13356709"
  CMAKE_VERSION: "3.31.6"
  PYTHON_VERSION: "3.13"

jobs:
  build:
    name: Build .so (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inject proxy wrapper into CMakeLists
        run: |
          cp trusttunnel_proxy_jni.cpp platform/android/
          if ! grep -q "trusttunnel_proxy" platform/android/CMakeLists.txt; then
            printf '\\nadd_library(trusttunnel_proxy SHARED ${CMAKE_CURRENT_SOURCE_DIR}/trusttunnel_proxy_jni.cpp)\\n' >> platform/android/CMakeLists.txt
            printf 'target_include_directories(trusttunnel_proxy PRIVATE ${CMAKE_SOURCE_DIR} ${CMAKE_SOURCE_DIR}/core/include ${CMAKE_SOURCE_DIR}/common ${CMAKE_SOURCE_DIR}/net ${CMAKE_SOURCE_DIR}/vpn)\\n' >> platform/android/CMakeLists.txt
            printf 'target_link_libraries(trusttunnel_proxy vpnlibs_core android log)\\n' >> platform/android/CMakeLists.txt
            echo "patched"
          fi

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build clang libc++-dev libc++abi-dev llvm pkg-config curl unzip git perl nasm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python deps
        run: |
          python3 -m venv ../env
          source ../env/bin/activate
          pip install --upgrade pip "conan>=2.0.5" cmake
          pip install -r scripts/requirements.txt || true
          echo "PATH=$(pwd)/../env/bin:$PATH" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo-ndk
        uses: actions/cache@v4
        id: cargo-ndk-cache
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-v3-linux

      - name: Install cargo-ndk
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.18.3'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;${{ env.NDK_VERSION }}" "cmake;${{ env.CMAKE_VERSION }}" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ matrix.abi }}-${{ hashFiles('conanfile.py','conandata.yml') }}
          restore-keys: conan2-${{ matrix.abi }}-

      - name: Configure Conan profile
        env:
          ABI: ${{ matrix.abi }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}
        run: |
          source ../env/bin/activate
          conan profile detect --force
          case "$ABI" in
            arm64-v8a)   CONAN_ARCH="armv8"  ;;
            armeabi-v7a) CONAN_ARCH="armv7"  ;;
            x86_64)      CONAN_ARCH="x86_64" ;;
          esac
          mkdir -p ~/.conan2/profiles conan/profiles
          python3 write_conan_profile.py "$ABI" "$CONAN_ARCH" "$BUILD_TYPE" "$ANDROID_NDK_HOME"
          printf 'set(CMAKE_ANDROID_NDK "%s")\nset(ANDROID_NDK "%s")\n' "$ANDROID_NDK_HOME" "$ANDROID_NDK_HOME" > conan/profiles/android.toolchain.cmake

      - name: Bootstrap Conan deps
        run: |
          source ../env/bin/activate
          python3 scripts/bootstrap_conan_deps.py --profile android_${{ matrix.abi }}

      - name: CMake configure
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}
          ABI: ${{ matrix.abi }}
        run: |
          source ../env/bin/activate
          cmake -B build_${ABI} -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${ABI} \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK_HOME" \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=26 \
            .

      - name: Build
        env:
          ABI: ${{ matrix.abi }}
        run: |
          source ../env/bin/activate
          cmake --build build_${ABI} --target vpnlibs_core trusttunnel_proxy --parallel $(nproc)

      - name: Collect .so files
        env:
          ABI: ${{ matrix.abi }}
        run: |
          mkdir -p artifacts/${ABI}
          find build_${ABI} -name "libtrustunnel_proxy.so" ! -path "*/CMakeFiles/*" -exec cp -v {} artifacts/${ABI}/ \;
          find build_${ABI} -name "libvpnlibs_core.so" ! -path "*/CMakeFiles/*" -exec cp -v {} artifacts/${ABI}/ \; 2>/dev/null || true
          find "$ANDROID_NDK_HOME" -path "*/${ABI}/libc++_shared.so" -exec cp -v {} artifacts/${ABI}/ \; 2>/dev/null || true
          ls -lh artifacts/${ABI}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tt-proxy-${{ matrix.abi }}-${{ github.event.inputs.build_type || 'Release' }}
          path: artifacts/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package all ABIs
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tt-proxy-*
          path: raw
          merge-multiple: false

      - name: Build jniLibs structure
        run: |
          mkdir -p jniLibs
          for dir in raw/tt-proxy-*/; do
            ABI=$(basename "$dir" | sed 's/^tt-proxy-//' | sed 's/-Release$//' | sed 's/-Debug$//')
            mkdir -p jniLibs/${ABI}
            find "$dir" -name "*.so" -exec cp -v {} jniLibs/${ABI}/ \;
          done
          find jniLibs -name "*.so" | sort

      - name: Create ZIP
        run: zip -r trusttunnel-android-jniLibs.zip jniLibs/

      - name: Upload combined
        uses: actions/upload-artifact@v4
        with:
          name: trusttunnel-android-all-abis
          path: trusttunnel-android-jniLibs.zip
          retention-days: 30
